version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vcoo
    volumes:
      - vcoo-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/vcoo
      MASTER_KEY: REPLACE_ME_GENERATE_A_SECURE_KEY
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  vcoo-data:
