services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vcoo
    volumes:
      - vcoo-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file:
      - ../apps/backend/.env
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/vcoo
      SECRET_KEY: dev-secret-key-change-in-production
      MASTER_KEY: dev-master-key-change-in-production
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  vcoo-data:
