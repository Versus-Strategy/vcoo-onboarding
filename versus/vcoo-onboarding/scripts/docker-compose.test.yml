version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vcoo
    volumes:
      - vcoo-test-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/vcoo
      MASTER_KEY: test-master-key
    depends_on:
      - db
    ports:
      - "8000:8000"

  sim_agent:
    image: python:3.11-slim
    volumes:
      - ./agent:/agent:ro
    working_dir: /agent
    command: ["/usr/local/bin/python", "agent.py", "SIM_TOKEN"]
    depends_on:
      - backend

volumes:
  vcoo-test-data:
